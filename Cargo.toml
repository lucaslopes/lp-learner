[package]
name = "lplearn"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Rust library and Python CLI for linear programming learning with primal-dual gradient methods."
repository = "https://github.com/lucaslopes/lplearn"
[lib]
name = "lp_learner"
path = "src/lib.rs"

[[bin]]
name = "lplearn-native"
path = "src/main.rs"

[[bin]]
name = "lplearn-solver"
path = "src/solver_cli.rs"

[[bin]]
name = "lplearn"
path = "src/cli_launcher.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
serde = []
