name: Wheel bridge

on: [push, pull_request]

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install 'maturin>=1.9,<2'
      - run: maturin build --release --out dist
      - run: python -m pip install dist/*.whl
      - name: Test installed wheel
        run: |
          python -m unittest discover -s tests -v
          python -m lplearn backend ping
      - if: runner.os != 'Windows'
        run: lplearn backend ping
      - if: runner.os == 'Windows'
        shell: cmd
        run: lplearn.cmd backend ping
      - name: Build and install the source distribution
        run: |
          python -m pip install 'build>=1,<2'
          python -m build --sdist --outdir dist
          python -m pip install --force-reinstall dist/*.tar.gz
      - name: Test installed source distribution
        run: |
          python -m unittest discover -s tests -v
          python -m lplearn backend ping
          python -m pip check
      - if: runner.os != 'Windows'
        run: lplearn backend ping
      - if: runner.os == 'Windows'
        shell: cmd
        run: lplearn.cmd backend ping
