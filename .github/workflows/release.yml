name: Versioned release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match tag and package versions
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          if not tag.startswith("v"):
              raise SystemExit(f"Expected a v-prefixed tag, got {tag!r}")
          release = tag[1:]
          project = tomllib.loads(Path("pyproject.toml").read_text())
          cargo = tomllib.loads(Path("Cargo.toml").read_text())
          python_version = project["project"]["version"]
          rust_version = cargo["package"]["version"]
          if python_version != release or rust_version != release:
              raise SystemExit(
                  f"tag={release}, pyproject={python_version}, "
                  f"Cargo={rust_version}"
              )
          print(f"Release version verified: {release}")
          PY

  wheels:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install 'maturin>=1.9,<2'
      - run: maturin build --release --out dist
      - run: python -m pip install --no-index dist/*.whl
      - run: python -m unittest discover -s tests -v
      - run: python -m lplearn backend ping
      - if: runner.os != 'Windows'
        run: lplearn backend ping
      - if: runner.os == 'Windows'
        shell: cmd
        run: lplearn.cmd backend ping
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install build
      - run: python -m build --sdist
      - run: python -m pip install --force-reinstall dist/*.tar.gz
      - run: python -m unittest discover -s tests -v
      - run: python -m lplearn backend ping
      - run: python -m pip check
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lplearn/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  verify-pypi:
    needs: publish-pypi
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and exercise the published wheel
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in {1..12}; do
            if python -m pip install "lplearn==$version"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            sleep 10
          done
          python -m lplearn backend ping
      - if: runner.os != 'Windows'
        run: lplearn backend ping
      - if: runner.os == 'Windows'
        shell: cmd
        run: lplearn.cmd backend ping

  github-release:
    needs: verify-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create GitHub Release with the published artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --repo
          "$GITHUB_REPOSITORY" --verify-tag --generate-notes
