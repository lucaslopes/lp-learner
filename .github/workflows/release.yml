name: Versioned release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml']

permissions:
  contents: read

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release metadata
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())
          cargo = tomllib.loads(Path("Cargo.toml").read_text())
          python_version = project["project"]["version"]
          rust_version = cargo["package"]["version"]
          if python_version != rust_version:
              raise SystemExit(f"pyproject={python_version}, Cargo={rust_version}")
          if os.environ["GITHUB_EVENT_NAME"] == "push":
              tag = os.environ["GITHUB_REF_NAME"]
              if tag != f"v{python_version}":
                  raise SystemExit(f"tag={tag}, expected v{python_version}")
          print(f"Release version verified: {python_version}")
          PY

  wheels:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install 'maturin>=1.9,<2'
      - run: maturin build --release --out dist
      - run: python -m pip install dist/*.whl
      - run: python -m pip install 'pytest>=8'
      - name: Test installed wheel
        env:
          WEB_WHEEL_CLI_TEST: "1"
        run: |
          python -m unittest discover -s tests -v
          python -m pytest -q tests/pytest_figure_checks.py tests/test_tutorial_stage.py
      - run: python -m lplearn backend ping
      - if: runner.os != 'Windows'
        run: lplearn backend ping
      - if: runner.os == 'Windows'
        shell: cmd
        run: lplearn.cmd backend ping
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install build
      - run: python -m build --sdist
      - run: python -m pip install --force-reinstall dist/*.tar.gz
      - run: python -m pip install 'pytest>=8'
      - name: Test installed source distribution
        env:
          WEB_WHEEL_CLI_TEST: "1"
        run: |
          python -m unittest discover -s tests -v
          python -m pytest -q tests/pytest_figure_checks.py tests/test_tutorial_stage.py
      - run: python -m lplearn backend ping
      - run: python -m pip check
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create GitHub Release with the tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --repo
          "$GITHUB_REPOSITORY" --verify-tag --generate-notes
