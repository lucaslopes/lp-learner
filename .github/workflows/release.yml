name: Versioned release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml']

permissions:
  contents: read

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require tag commit on main
        if: github.event_name == 'push'
        env:
          TAG_COMMIT: ${{ github.sha }}
        run: |
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Tag commit is not reachable from origin/main."
            echo "$TAG_COMMIT"
            exit 1
          fi
      - name: Match tag and package versions
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())
          cargo = tomllib.loads(Path("Cargo.toml").read_text())
          python_version = project["project"]["version"]
          rust_version = cargo["package"]["version"]
          if python_version != rust_version:
              raise SystemExit(f"pyproject={python_version}, Cargo={rust_version}")
          if os.environ["GITHUB_EVENT_NAME"] == "push":
              tag = os.environ["GITHUB_REF_NAME"]
              if tag != f"v{python_version}":
                  raise SystemExit(f"tag={tag}, expected v{python_version}")
          print(f"Release version verified: {python_version}")
          PY

  wheels:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python_arch: x64
            platform_suffix: x86_64
          - os: ubuntu-24.04-arm
            python_arch: arm64
            platform_suffix: aarch64
          - os: macos-15-intel
            python_arch: x64
            platform_suffix: x86_64
          - os: macos-15
            python_arch: arm64
            platform_suffix: arm64
          - os: windows-2025
            python_arch: x64
            platform_suffix: win-amd64
          - os: windows-11-arm
            python_arch: arm64
            platform_suffix: win-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - name: Verify Python target architecture
        env:
          EXPECTED_PLATFORM_SUFFIX: ${{ matrix.platform_suffix }}
        run: |
          python - <<'PY'
          import os
          import sysconfig

          actual = sysconfig.get_platform().lower()
          expected = os.environ["EXPECTED_PLATFORM_SUFFIX"]
          print("Python platform:", actual, "expected suffix:", expected)
          raise SystemExit(0 if actual.endswith(expected) else 1)
          PY
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install 'maturin>=1.9,<2'
      - run: maturin build --release --out dist
      - run: python -m pip install dist/*.whl
      - run: python -m pip install 'pytest>=8'
      - run: python -m pip check
      - name: Test installed wheel
        env:
          WEB_WHEEL_CLI_TEST: "1"
        timeout-minutes: 8
        run: python -m unittest discover -s tests -v
      - name: Test publication figure suite
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        timeout-minutes: 8
        run: python -m pytest -vv -o faulthandler_timeout=180 tests/pytest_figure_checks.py
      - name: Test tutorial stage
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        timeout-minutes: 8
        run: python -m pytest -vv -o faulthandler_timeout=180 tests/test_tutorial_stage.py
      - run: python -m lplearn backend ping
      - if: runner.os != 'Windows'
        run: lplearn backend ping
      - if: runner.os == 'Windows'
        shell: cmd
        run: lplearn.cmd backend ping
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.python_arch }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install 'build>=1,<2' 'pytest>=8'
      - run: python -m build --sdist
      - run: python -m pip install --force-reinstall dist/*.tar.gz
      - run: python -m pip check
      - name: Test installed source distribution
        env:
          WEB_WHEEL_CLI_TEST: "1"
        timeout-minutes: 8
        run: python -m unittest discover -s tests -v
      - name: Test source distribution figures
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        timeout-minutes: 8
        run: python -m pytest -vv -o faulthandler_timeout=180 tests/pytest_figure_checks.py
      - name: Test source distribution tutorial stage
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        timeout-minutes: 8
        run: python -m pytest -vv -o faulthandler_timeout=180 tests/test_tutorial_stage.py
      - run: python -m lplearn backend ping
      - run: lplearn backend ping
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create GitHub Release with the tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --repo
          "$GITHUB_REPOSITORY" --verify-tag --generate-notes
