name: TestPyPI rehearsal

on:
  pull_request:
    paths:
      - .github/workflows/testpypi.yml
      - Cargo.toml
      - build.rs
      - pyproject.toml
      - python/**
      - src/**
      - tests/**
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA of the audited v1.0.0 tag
        required: true
        type: string
      release_run:
        description: Successful GitHub release Actions run for that tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: testpypi-rehearsal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require matching package versions
        id: metadata
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())
          cargo = tomllib.loads(Path("Cargo.toml").read_text())
          python_version = project["project"]["version"]
          rust_version = cargo["package"]["version"]
          if python_version != rust_version:
              raise SystemExit(
                  f"pyproject={python_version}, Cargo={rust_version}"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={python_version}\n")
          print(f"TestPyPI rehearsal version: {python_version}")
          PY

  wheels:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python_arch: x64
            platform_suffix: x86_64
          - os: ubuntu-24.04-arm
            python_arch: arm64
            platform_suffix: aarch64
          - os: macos-15-intel
            python_arch: x64
            platform_suffix: x86_64
          - os: macos-15
            python_arch: arm64
            platform_suffix: arm64
          - os: windows-2025
            python_arch: x64
            platform_suffix: win-amd64
          - os: windows-11-arm
            python_arch: arm64
            platform_suffix: win-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - name: Verify Python target architecture
        env:
          EXPECTED_ARCH: ${{ matrix.python_arch }}
        run: |
          python - <<'PY'
          import os
          import platform

          actual = platform.machine().lower()
          expected = os.environ["EXPECTED_ARCH"]
          aliases = {
              "x64": {"x86_64", "amd64"},
              "arm64": {"arm64", "aarch64"},
          }
          print("Python machine:", actual, "expected architecture:", expected)
          raise SystemExit(0 if actual in aliases[expected] else 1)
          PY
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install 'maturin>=1.9,<2'
      - run: maturin build --release --out dist
      - run: python -m pip install dist/*.whl
      - run: python -m pip install 'pytest>=8'
      - name: Test installed wheel and Python entry point
        env:
          WEB_WHEEL_CLI_TEST: "1"
        timeout-minutes: 8
        run: python -m unittest discover -s tests -v
      - name: Test publication figure suite
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        timeout-minutes: 8
        run: python -m pytest -vv -o faulthandler_timeout=180 tests/pytest_figure_checks.py
      - name: Test tutorial stage
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        timeout-minutes: 8
        run: python -m pytest -vv -o faulthandler_timeout=180 tests/test_tutorial_stage.py
      - run: python -m lplearn backend ping
      - if: runner.os != 'Windows'
        run: lplearn backend ping
      - if: runner.os == 'Windows'
        shell: cmd
        run: lplearn.cmd backend ping
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.python_arch }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install 'maturin>=1.9,<2' 'build>=1,<2'
      - run: python -m build --sdist --outdir dist
      - run: python -m pip install --force-reinstall dist/*.tar.gz
      - run: python -m pip install 'pytest>=8'
      - name: Test installed source distribution
        env:
          WEB_WHEEL_CLI_TEST: "1"
        timeout-minutes: 8
        run: python -m unittest discover -s tests -v
      - name: Test source distribution figures
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        timeout-minutes: 8
        run: python -m pytest -vv -o faulthandler_timeout=180 tests/pytest_figure_checks.py
      - name: Test source distribution tutorial stage
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        timeout-minutes: 8
        run: python -m pytest -vv -o faulthandler_timeout=180 tests/test_tutorial_stage.py
      - run: python -m lplearn backend ping
      - run: python -m pip check
      - run: lplearn backend ping
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  collect-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v1.0.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match the immutable tag and successful release run
        env:
          GH_TOKEN: ${{ github.token }}
          AUDITED_COMMIT: ${{ inputs.commit }}
          RELEASE_RUN: ${{ inputs.release_run }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          if os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("Dispatch from main")
          commit = os.environ["AUDITED_COMMIT"]
          run_id = os.environ["RELEASE_RUN"]
          if not re.fullmatch(r"[0-9a-f]{40}", commit) or not run_id.isdecimal():
              raise SystemExit("Expected a full commit SHA and a numeric release run ID")
          tag_commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if tag_commit != commit:
              raise SystemExit("v1.0.0 does not point to the audited commit")
          project = tomllib.loads(Path("pyproject.toml").read_text())
          cargo = tomllib.loads(Path("Cargo.toml").read_text())
          if project["project"]["version"] != "1.0.0" or cargo["package"]["version"] != "1.0.0":
              raise SystemExit("The tagged package metadata does not report 1.0.0")

          repo = os.environ["GITHUB_REPOSITORY"]
          run = json.loads(subprocess.check_output(
              ["gh", "api", f"repos/{repo}/actions/runs/{run_id}"], text=True
          ))
          expected = {
              "head_sha": commit, "head_branch": "v1.0.0", "event": "push",
              "path": ".github/workflows/release.yml", "conclusion": "success",
          }
          if any(run.get(key) != value for key, value in expected.items()):
              raise SystemExit("The supplied run is not the successful release for the audited tag")
          print(f"Verified tag v1.0.0 at {commit} and GitHub Actions run {run_id}")
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run }}
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Verify release archive and existing TestPyPI digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import urlopen

          files = [file for file in Path("dist").iterdir() if file.is_file()]
          wheels = [file for file in files if file.name.startswith("lplearn-1.0.0-") and file.suffix == ".whl"]
          if len(files) != 7 or len(wheels) != 6 or not Path("dist/lplearn-1.0.0.tar.gz").is_file():
              raise SystemExit("Expected the six tested wheels and the 1.0.0 source distribution")
          digests = {file.name: hashlib.sha256(file.read_bytes()).hexdigest() for file in files}

          repo = os.environ["GITHUB_REPOSITORY"]
          release = json.loads(subprocess.check_output(
              ["gh", "api", f"repos/{repo}/releases/tags/v1.0.0"], text=True
          ))
          published = {asset["name"]: asset["digest"] for asset in release["assets"]}
          if release["draft"] or published != {name: f"sha256:{sha}" for name, sha in digests.items()}:
              raise SystemExit("Release attachments differ from the tested run's artifacts")

          try:
              with urlopen("https://test.pypi.org/pypi/lplearn/1.0.0/json", timeout=30) as response:
                  existing = json.load(response)["urls"]
          except HTTPError as error:
              if error.code != 404:
                  raise
              existing = []
          for file in existing:
              name = file["filename"]
              if digests.get(name) != file["digests"]["sha256"]:
                  raise SystemExit(f"Conflicting existing TestPyPI file: {name}")

          for name, digest in sorted(digests.items()):
              print(f"{digest}  {name}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: audited-release-distributions
          path: dist/*
          if-no-files-found: error

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: collect-release
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/lplearn/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: audited-release-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Collection checks any existing files before a retry.
          skip-existing: true

  verify-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: [collect-release, publish-testpypi]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python_arch: x64
            platform_suffix: x86_64
          - os: ubuntu-24.04-arm
            python_arch: arm64
            platform_suffix: aarch64
          - os: macos-15-intel
            python_arch: x64
            platform_suffix: x86_64
          - os: macos-15
            python_arch: arm64
            platform_suffix: arm64
          - os: windows-2025
            python_arch: x64
            platform_suffix: win-amd64
          - os: windows-11-arm
            python_arch: arm64
            platform_suffix: win-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - name: Verify Python target architecture
        env:
          EXPECTED_ARCH: ${{ matrix.python_arch }}
        run: |
          python - <<'PY'
          import os
          import platform

          actual = platform.machine().lower()
          expected = os.environ["EXPECTED_ARCH"]
          aliases = {
              "x64": {"x86_64", "amd64"},
              "arm64": {"arm64", "aarch64"},
          }
          print("Python machine:", actual, "expected architecture:", expected)
          raise SystemExit(0 if actual in aliases[expected] else 1)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: audited-release-distributions
          path: expected
      - name: Install and exercise the exact wheel downloaded from TestPyPI
        run: |
          for attempt in {1..12}; do
            if python -m pip --isolated download \
              --index-url https://test.pypi.org/simple/ --no-cache-dir \
              --no-deps --only-binary=:all: --dest downloaded \
              lplearn==1.0.0; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            sleep 10
          done
          python - <<'PY'
          import hashlib
          from pathlib import Path

          wheel, = Path("downloaded").glob("*.whl")
          expected = Path("expected") / wheel.name
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          if digest != hashlib.sha256(expected.read_bytes()).hexdigest():
              raise SystemExit(f"TestPyPI wheel differs from the tested GitHub artifact: {wheel.name}")
          print(f"{digest}  {wheel.name}")
          PY
          python -m pip --isolated install --index-url https://pypi.org/simple/ downloaded/*.whl
          python -m lplearn backend ping
          python -m pip check
      - name: Verify the source distribution downloaded from TestPyPI
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python - <<'PY'
          import hashlib
          import json
          import time
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import urlparse
          from urllib.request import urlopen

          filename = "lplearn-1.0.0.tar.gz"
          for attempt in range(12):
              try:
                  with urlopen("https://test.pypi.org/pypi/lplearn/1.0.0/json", timeout=30) as response:
                      files = json.load(response)["urls"]
                  sdist = next((file for file in files if file["filename"] == filename), None)
                  if sdist is not None:
                      break
              except HTTPError as error:
                  if error.code != 404:
                      raise
              if attempt < 11:
                  time.sleep(10)
          else:
              raise SystemExit("Source distribution is not visible on TestPyPI")

          url = sdist["url"]
          if (urlparse(url).scheme, urlparse(url).hostname) != ("https", "test-files.pythonhosted.org"):
              raise SystemExit("Unexpected TestPyPI file origin")
          with urlopen(url, timeout=60) as response:
              digest = hashlib.sha256(response.read()).hexdigest()
          expected = hashlib.sha256((Path("expected") / filename).read_bytes()).hexdigest()
          if digest != expected or digest != sdist["digests"]["sha256"]:
              raise SystemExit("TestPyPI source distribution differs from the tested GitHub artifact")
          print(f"{digest}  {filename}")
          PY
      - if: runner.os != 'Windows'
        run: lplearn backend ping
      - if: runner.os == 'Windows'
        shell: cmd
        run: lplearn.cmd backend ping
