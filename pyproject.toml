[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "lplearn"
version = "0.7.0"
description = "Python CLI and Rust backend for weakly coupled MDP policy learning"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26,<2.3",
    "scipy>=1.11",
    "cvxpy>=1.5",
    "clarabel>=0.7",
    "numba>=0.59",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "tqdm>=4.66",
    "deepdiff>=6.7",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
torch = ["torch"]

[project.urls]
Documentation = "https://github.com/lucaslopes/lplearn/blob/main/docs/python-rust-bridge.md"
Homepage = "https://github.com/lucaslopes/lplearn"
Repository = "https://github.com/lucaslopes/lplearn"

[tool.maturin]
bindings = "bin"
python-source = "python"
module-name = "lplearn"
targets = [
    { name = "lplearn-native", kind = "bin" },
    { name = "lplearn-solver", kind = "bin" },
]
